  let dynamicData = [];

  function initDynamic() {
    return RECETTES.map(r => ({
      portions: r.portions,
      coeff: 3.5,
      ingredients: r.ingredients.map(ing => ({ pa: ing.pa, qte: ing.qte }))
    }));
  }

  function loadStorage() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length === RECETTES.length) {
          dynamicData = parsed;
          for (let i = 0; i < RECETTES.length; i++) {
            if (dynamicData[i].portions) RECETTES[i].portions = dynamicData[i].portions;
            if (dynamicData[i].coeff !== undefined) dynamicData[i].coeff = dynamicData[i].coeff;
            const dynIngs = dynamicData[i].ingredients;
            if (dynIngs && dynIngs.length === RECETTES[i].ingredients.length) {
              for (let j = 0; j < RECETTES[i].ingredients.length; j++) {
                if (dynIngs[j].pa !== undefined) RECETTES[i].ingredients[j].pa = dynIngs[j].pa;
                if (dynIngs[j].qte !== undefined) RECETTES[i].ingredients[j].qte = dynIngs[j].qte;
              }
            }
          }
        } else dynamicData = initDynamic();
      } else dynamicData = initDynamic();
    } catch(e) { dynamicData = initDynamic(); }
  }
  function saveDynamic() {
    const toStore = dynamicData.map((d, idx) => ({
      portions: RECETTES[idx].portions,
      coeff: d.coeff,
      ingredients: RECETTES[idx].ingredients.map(ing => ({ pa: ing.pa, qte: ing.qte }))
    }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toStore));
  }
  function getPU(ing) { return ing.pa / ing.qr; }
  function getCout(ing) { return ing.qte * getPU(ing); }
  function recalcFiche(idx) {
    const rec = RECETTES[idx];
    const total = rec.ingredients.reduce((s, ing) => s + getCout(ing), 0);
    const portions = rec.portions;
    const costPerPortion = total / portions;
    const coeff = dynamicData[idx].coeff;
    const pv = costPerPortion * coeff;
    const marge = pv > 0 ? ((pv - costPerPortion) / pv) * 100 : 0;
    document.getElementById(`ct-${idx}`).innerText = total.toFixed(2) + ' €';
    document.getElementById(`cp-${idx}`).innerText = costPerPortion.toFixed(2) + ' €';
    document.getElementById(`cv-${idx}`).innerText = pv.toFixed(2) + ' € HT';
    document.getElementById(`cm-${idx}`).innerText = marge.toFixed(1) + '%';
    const bar = document.getElementById(`mb-${idx}`);
    if (bar) bar.style.width = Math.min(100, Math.max(0, marge)) + '%';
    document.getElementById(`pd-${idx}`).innerText = rec.portions;
    rec.ingredients.forEach((ing, ipos) => {
      const puSpan = document.getElementById(`pu-${idx}-${ipos}`);
      if (puSpan) puSpan.innerText = getPU(ing).toFixed(4) + ' €';
      const coSpan = document.getElementById(`co-${idx}-${ipos}`);
      if (coSpan) coSpan.innerText = getCout(ing).toFixed(2) + ' €';
      const qtyInp = document.getElementById(`qty-${idx}-${ipos}`);
      if (qtyInp && qtyInp.value != ing.qte) qtyInp.value = ing.qte;
    });
  }
  function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  function buildFiche(rec, idx) {
    let diffClass = 'tag-teal';
    if (rec.diff === 'Expert') diffClass = 'tag-coral';
    else if (rec.diff === 'Difficile') diffClass = 'tag-amber';
    else if (rec.diff === 'Très difficile') diffClass = 'tag-red';
    else if (rec.diff === 'Facile') diffClass = 'tag-blue';
    const ingRows = rec.ingredients.map((ing, i) => `
      <tr>
        <td style="font-weight:600">${escapeHtml(ing.n)}</td>
        <td style="padding:3px;"><input type="number" class="ni qty" data-idx="${idx}" data-pos="${i}" value="${ing.qte}" step="any" style="width:75px;"></td>
        <td>${ing.u}</td>
        <td class="td-a"><input type="number" class="ni a" data-idx="${idx}" data-pos="${i}" value="${ing.pa.toFixed(2)}" step="0.01" min="0" style="width:70px;"></td>
        <td id="pu-${idx}-${i}" style="text-align:right;">${getPU(ing).toFixed(4)} €</td>
        <td id="co-${idx}-${i}" style="text-align:right;font-weight:600;">${getCout(ing).toFixed(2)} €</td>
      </tr>
    `).join('');
    const stepsHtml = rec.steps.map((s,i) => `<div class="step"><div class="snum">${i+1}</div><div><div class="stitle">${escapeHtml(s)}</div></div></div>`).join('');
    const allergHtml = rec.allerg.map(a => `<span class="tag tag-red">⚠ ${escapeHtml(a)}</span>`).join('');
    const equipHtml = rec.equip.map(e => `<span class="tag tag-gray">${escapeHtml(e)}</span>`).join('');
    return `
      <div class="fiche" id="f${idx}">
        <div class="print-bar"><button class="btn-print" onclick="window.print()">🖨 Imprimer PDF</button></div>
        <div class="fiche-header"><div style="display:flex; justify-content:space-between;"><div><div class="fiche-title">${rec.num} — ${escapeHtml(rec.nom)}</div><div class="fiche-source">p.${rec.page} · ${rec.sousTitre}</div><div class="tags"><span class="tag tag-blue">Boulangerie</span><span class="tag ${diffClass}">${rec.diff}</span></div></div><div><div class="plbl">Portions</div><div class="pbig" id="pd-${idx}">${rec.portions}</div></div></div></div>
        <div class="two-col"><div class="card"><div class="clabel">⏱ Temps</div><div class="ri"><span class="rl">Préparation</span><span class="rv">${rec.tprep}</span></div><div class="ri"><span class="rl">Cuisson</span><span class="rv">${rec.tcuisson}</span></div><div class="ri"><span class="rl">Façonnage</span><span class="rv">${rec.tmontage}</span></div></div><div class="card"><div class="clabel">💰 Coût & marge</div><div class="ri"><span class="rl">Coût total</span><span class="rv" id="ct-${idx}">—</span></div><div class="ri"><span class="rl">Coût / portion</span><span class="rv" id="cp-${idx}">—</span></div><div class="ri"><span class="rl">Prix vente HT</span><span class="rv" id="cv-${idx}">—</span></div><div class="ri"><span class="rl">Marge brute</span><span class="rv" id="cm-${idx}">—</span></div></div></div>
        <div class="card"><div class="clabel">🥖 Ingrédients (Qté & prix modifiables)</div><table class="ingr-table"><thead><tr><th>Ingrédient</th><th>Qté</th><th>Unité</th><th>Prix achat (€)</th><th>Prix unit.</th><th>Coût total</th></tr></thead><tbody>${ingRows}</tbody></table>
        <div style="margin-top:10px; display:flex; gap:1rem; flex-wrap:wrap;"><div><span class="plbl">Nb portions</span> <input type="number" id="port-${idx}" class="ni" value="${rec.portions}" min="1" style="width:70px;"></div><div><span class="plbl">Coef. vente</span> <input type="number" id="coeff-${idx}" class="ni" value="${dynamicData[idx].coeff}" step="0.1" min="1.2" style="width:65px;"></div><div style="flex:1"><div class="plbl">Marge réelle</div><div class="env-bar"><div id="mb-${idx}" style="height:100%; width:0%;"></div></div></div></div></div>
        <div class="card"><div class="clabel">📋 Étapes</div>${stepsHtml}</div>
        <div class="two-col"><div class="card"><div class="clabel">⚙️ Équipements</div><div class="tags-row">${equipHtml}</div></div><div class="card"><div class="clabel">⚠️ Allergènes</div><div class="tags-row">${allergHtml}</div></div></div>
        <div class="card"><div class="clabel">🍽 Présentation</div><p style="font-size:12px;">${escapeHtml(rec.presentation)}</p></div>
        <div class="card"><div class="clabel">🌱 Impact environnemental</div><div>Empreinte ${rec.envlbl}<div class="env-bar"><div class="env-fill" style="width:${Math.min(100,rec.env)}%;background:${rec.envcol};"></div></div>CO₂: ${rec.co2} ${rec.co2.includes('kg')?'':''} · Eau: ${rec.eau} ${rec.eau.includes('L')?'':'L'}</div></div>
        <div class="card"><div class="clabel">🍞 Nutrition (par portion)</div><div class="nut-grid"><div class="nc"><div class="nv">${rec.nut.kcal}</div><div class="nl">kcal</div></div><div class="nc"><div class="nv">${rec.nut.prot}g</div><div class="nl">prot.</div></div><div class="nc"><div class="nv">${rec.nut.lip}g</div><div class="nl">lip.</div></div><div class="nc"><div class="nv">${rec.nut.glu}g</div><div class="nl">gluc.</div></div></div></div>
      </div>
    `;
  }
  function bindEvents(idx) {
    const portInput = document.getElementById(`port-${idx}`);
    const coeffInput = document.getElementById(`coeff-${idx}`);
    if (portInput) portInput.addEventListener('input', () => { RECETTES[idx].portions = Math.max(1, parseInt(portInput.value)||1); dynamicData[idx].portions = RECETTES[idx].portions; document.getElementById(`pd-${idx}`).innerText = RECETTES[idx].portions; recalcFiche(idx); saveDynamic(); });
    if (coeffInput) coeffInput.addEventListener('input', () => { dynamicData[idx].coeff = parseFloat(coeffInput.value)||3.0; recalcFiche(idx); saveDynamic(); });
    document.querySelectorAll(`.ni.qty[data-idx="${idx}"]`).forEach(inp => inp.addEventListener('input', () => { const pos = parseInt(inp.dataset.pos); const nv = parseFloat(inp.value); if(!isNaN(nv) && RECETTES[idx].ingredients[pos]) { RECETTES[idx].ingredients[pos].qte = nv; dynamicData[idx].ingredients[pos].qte = nv; recalcFiche(idx); saveDynamic(); } }));
    document.querySelectorAll(`.ni.a[data-idx="${idx}"]`).forEach(inp => inp.addEventListener('input', () => { const pos = parseInt(inp.dataset.pos); const nv = parseFloat(inp.value); if(!isNaN(nv) && RECETTES[idx].ingredients[pos]) { RECETTES[idx].ingredients[pos].pa = nv; dynamicData[idx].ingredients[pos].pa = nv; recalcFiche(idx); saveDynamic(); } }));
  }
  function buildNavAndFiches() {
    const navDiv = document.getElementById('nav');
    const fichesDiv = document.getElementById('fiches');
    navDiv.innerHTML = ''; fichesDiv.innerHTML = '';
    RECETTES.forEach((rec, i) => {
      const btn = document.createElement('button');
      btn.className = 'nav-btn' + (i===0 ? ' active' : '');
      btn.innerHTML = `<span class="nnum">${rec.num}</span><span class="nname">${escapeHtml(rec.nom.substring(0,20))}</span>`;
      btn.onclick = () => { document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); document.querySelectorAll('.fiche').forEach(f=>f.classList.remove('active')); document.getElementById(`f${i}`).classList.add('active'); };
      navDiv.appendChild(btn);
      fichesDiv.insertAdjacentHTML('beforeend', buildFiche(rec, i));
    });
    for(let i=0;i<RECETTES.length;i++) { recalcFiche(i); bindEvents(i); }
    // Navigation par ancre URL
  const hash = window.location.hash;
  if (hash && hash.startsWith('#f')) {
    const idx = parseInt(hash.substring(2));
    if (!isNaN(idx) && document.getElementById('f' + idx)) {
      document.querySelectorAll('.fiche').forEach(f => f.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('f' + idx).classList.add('active');
      const navBtns = document.querySelectorAll('.nav-btn');
      if (navBtns[idx]) navBtns[idx].classList.add('active');
    } else {
      document.getElementById('f0')?.classList.add('active');
    }
  } else {
    document.getElementById('f0')?.classList.add('active');
  }
  }
  loadStorage();
  buildNavAndFiches();
  saveDynamic();
})();
</script>
</body>
